name: Release Android

# Builds, verifies and publishes a complete release: signed APK on the GitHub
# Release, signed OTA bundle, signed content package, and one update manifest
# that describes all three. The manifest is deployed last so an installed app
# can never read a pointer to an artifact that is not there yet.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish v${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Read the version and check it against the tag
        id: version
        run: |
          VERSION_NAME=$(node -p "require('./version.json').versionName")
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$VERSION_NAME" ]; then
            echo "Tag ${{ github.ref_name }} does not match version.json ($VERSION_NAME)." >&2
            exit 1
          fi

      - name: Restore the Android signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured." >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the web payload and sync Capacitor
        run: |
          npm run web:build
          npx cap sync android

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify the APK identity and signing certificate
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 || '62377a571b33c348a2ed61f08e538108b0b76338dcdaa7e029e0e3172a17a374' }}
        run: |
          node scripts/updates/check-apk.js \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Build and sign the OTA bundle and content package
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          npm run release:web
          npm run release:content
          npm run updates:manifest -- \
            --apk android/app/build/outputs/apk/release/app-release.apk

      - name: Verify the whole update set
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: npm run release:verify

      - name: Write release checksums
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum app-release.apk > "studysynth-${{ steps.version.outputs.name }}.apk.sha256"
          cat "studysynth-${{ steps.version.outputs.name }}.apk.sha256"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.name }}"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APK_SUM="android/app/build/outputs/apk/release/studysynth-${{ steps.version.outputs.name }}.apk.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APK_SUM" dist/updates/manifest.json --clobber
          else
            gh release create "$TAG" "$APK" "$APK_SUM" dist/updates/manifest.json \
              --title "StudySynth ${{ steps.version.outputs.name }}" \
              --notes-file "docs/release-notes/${{ steps.version.outputs.name }}.md"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the update site
        uses: actions/upload-pages-artifact@v3
        with:
          path: updates-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
